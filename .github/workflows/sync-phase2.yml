name: sync-phase2

on:
  push:
    branches: [main]
    paths:
      - ".github/sync-phase2-trigger"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of films to upload in one run"
        required: false
        default: "20"
      num_shards:
        description: "Total parallel shards"
        required: false
        default: "2"
  schedule:
    - cron: "*/30 * * * *"

jobs:
  upload-batch:
    name: Upload Phase 2 films (shard ${{ matrix.shard }}/${{ inputs.num_shards || '2' }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    concurrency:
      group: prehrajto-phase2-sync-shard-${{ matrix.shard }}
      cancel-in-progress: false
    env:
      SYNC_BACKLOG: backlog/phase2-candidate-films.jsonl.gz
      SYNC_STATE_PREFIX: phase2-uploaded
      SYNC_LOG_PREFIX: phase2-sync
      SYNC_NUM_SHARDS: ${{ inputs.num_shards || '2' }}
      SYNC_SHARD_ID: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PUSH_TOKEN }}
          ref: main
          persist-credentials: true

      - name: Refresh to latest origin/main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Now on $(git rev-parse HEAD): $(git log -1 --format=%s)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Init log entry
        run: |
          mkdir -p state
          LOG="state/${SYNC_LOG_PREFIX}-shard-${SYNC_SHARD_ID}.log"
          touch "$LOG"
          RUN_TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo ""
            echo "===== run $RUN_TS shard=${SYNC_SHARD_ID}/${SYNC_NUM_SHARDS} batch_size=${{ inputs.batch_size }} ($RUN_URL) ====="
          } >> "$LOG"

      - name: Configure git for in-job pushes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run sync batch
        env:
          PREHRAJTO_EMAIL: ${{ secrets.PREHRAJTO_EMAIL }}
          PREHRAJTO_PASSWORD: ${{ secrets.PREHRAJTO_PASSWORD }}
          CZ_PROXY_URL: ${{ secrets.CZ_PROXY_URL }}
          CZ_PROXY_KEY: ${{ secrets.CZ_PROXY_KEY }}
        run: |
          python src/sync_batch.py --count "${{ inputs.batch_size || '20' }}"

      - name: Commit state + log
        if: always()
        run: |
          set -e
          STATE="state/${SYNC_STATE_PREFIX}-shard-${SYNC_SHARD_ID}.json"
          LOG="state/${SYNC_LOG_PREFIX}-shard-${SYNC_SHARD_ID}.log"
          mkdir -p state
          touch "$STATE" "$LOG"
          git add "$STATE" "$LOG"
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            UP_COUNT=$(python -c "import json,os; p='$STATE'; d=json.load(open(p)) if os.path.getsize(p)>0 else {}; print(len(d.get('uploads',[])))")
            git commit -m "chore(phase2 shard ${SYNC_SHARD_ID}/${SYNC_NUM_SHARDS}): batch run -- total uploads now ${UP_COUNT}"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
