name: sync

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of films to upload in one run"
        required: false
        default: "50"
  schedule:
    # Every 6 hours. With ~216 s/film and batch_size=50, a batch needs
    # ~3 h, so cron interval has ~3 h of slack before the next run.
    # Concurrency lock below also prevents overlap if a batch overruns.
    - cron: "0 */6 * * *"

# Only one sync batch can run at a time. cancel-in-progress=false means
# a queued cron run waits for the current one to finish (rather than
# killing it mid-upload).
concurrency:
  group: prehrajto-sync-batch
  cancel-in-progress: false

jobs:
  upload-batch:
    name: Upload N missing films
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Init log entry
        run: |
          mkdir -p state
          touch state/sync.log
          RUN_TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo ""
            echo "===== run $RUN_TS batch_size=${{ inputs.batch_size }} ($RUN_URL) ====="
          } >> state/sync.log

      - name: Run sync batch
        env:
          PREHRAJTO_EMAIL: ${{ secrets.PREHRAJTO_EMAIL }}
          PREHRAJTO_PASSWORD: ${{ secrets.PREHRAJTO_PASSWORD }}
          # prehraj.to website (detail/resolve) is geofenced to CZ residential
          # IPs. Route HTML scraping through chobotnice.aspfree.cz/Proxy.ashx
          # — same Czech ASP relay that cr-web uses for its stream resolver.
          # Login + multipart upload still go direct (those endpoints are not
          # geo-blocked, as proven by the existing prehrajto-sync workflow).
          CZ_PROXY_URL: ${{ secrets.CZ_PROXY_URL }}
          CZ_PROXY_KEY: ${{ secrets.CZ_PROXY_KEY }}
        run: |
          python src/sync_batch.py --count "${{ inputs.batch_size }}"

      - name: Commit state + log
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p state
          touch state/uploaded.json state/sync.log
          git add state/uploaded.json state/sync.log
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            UP_COUNT=$(python -c "import json,os; p='state/uploaded.json'; d=json.load(open(p)) if os.path.getsize(p)>0 else {}; print(len(d.get('uploads',[])))")
            git commit -m "chore(sync): batch run — total uploads now ${UP_COUNT}"
            git pull --rebase origin main || true
            git push
          fi
